name: kernelon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kernelon
      POSTGRES_USER: kernelon
      POSTGRES_PASSWORD: kernelon
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kernelon -d kernelon']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kernelon-postgres-data:/var/lib/postgresql/data
    ports:
      - '${KERNELON_POSTGRES_PORT:-5432}:5432'

  api:
    build:
      context: ./apps/api
    environment:
      KERNELON_ENVIRONMENT: development
      KERNELON_DATABASE_URL: postgresql+psycopg://kernelon:kernelon@postgres:5432/kernelon
      KERNELON_HOST: 0.0.0.0
      KERNELON_PORT: 8000
      KERNELON_ALLOWED_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000","http://127.0.0.1:3002","http://localhost:3002","http://tauri.localhost","tauri://localhost"]'
      KERNELON_ALLOWED_HOSTS: '["127.0.0.1","127.0.0.1:8000","localhost","localhost:8000","api","api:8000"]'
      KERNELON_LOG_LEVEL: INFO
      KERNELON_OPENAPI_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${KERNELON_API_PORT:-8000}:8000'

volumes:
  kernelon-postgres-data:
