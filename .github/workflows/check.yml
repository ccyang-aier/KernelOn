name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kernelon
          POSTGRES_USER: kernelon
          POSTGRES_PASSWORD: kernelon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelon -d kernelon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNELON_DATABASE_URL: postgresql+psycopg://kernelon:kernelon@127.0.0.1:5432/kernelon
      KERNELON_TEST_DATABASE_URL: postgresql+psycopg://kernelon:kernelon@127.0.0.1:5432/kernelon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked
      - run: pnpm db:upgrade
      - run: pnpm db:upgrade
      - run: pnpm check
      - run: docker build --tag kernelon-api:check apps/api
      - name: Verify non-root image user
        run: test "$(docker run --rm --entrypoint id kernelon-api:check -u)" != "0"
